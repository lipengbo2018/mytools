<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>极简KitBox</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #222831;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #ff5722;
      --primary-dark: #e64a19;
      --danger: #dc2626;
      --shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    button, input, select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 248px minmax(0, 1fr);
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      background: var(--panel);
      border-right: 1px solid var(--line);
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 750;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--primary);
      font-weight: 800;
    }

    .nav {
      display: grid;
      gap: 8px;
    }

    .nav-btn {
      width: 100%;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      text-align: left;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-btn:hover {
      background: #f3f4f6;
    }

    .nav-btn.active {
      background: #fff0eb;
      color: var(--primary);
      font-weight: 700;
    }

    .side-category-panel {
      display: grid;
      gap: 8px;
      min-height: 0;
    }

    .side-title {
      padding: 0 14px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .side-category-list {
      display: grid;
      gap: 6px;
      overflow: auto;
      padding-right: 2px;
    }

    .side-category-btn {
      width: 100%;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      text-align: left;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .side-category-btn:hover {
      background: #f3f4f6;
    }

    .side-category-btn.active {
      background: #fff0eb;
      color: var(--primary);
      font-weight: 700;
    }

    .side-category-count {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .side-category-btn.active .side-category-count {
      color: var(--primary);
    }

    .side-actions {
      margin-top: auto;
      display: grid;
      gap: 10px;
    }

    .main {
      padding: 28px;
      min-width: 0;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .title h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.2;
    }

    .title p {
      margin: 8px 0 0;
      color: var(--muted);
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .category-filter {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      flex-wrap: wrap;
    }

    .search {
      width: 220px;
      min-width: 160px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 12px;
      background: #fff;
    }

    .btn {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 13px;
      background: #fff;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:hover {
      border-color: #cbd5e1;
      background: #f9fafb;
    }

    .btn.primary {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .btn.primary:hover {
      border-color: var(--primary-dark);
      background: var(--primary-dark);
    }

    .btn.danger {
      color: var(--danger);
    }

    .btn.icon {
      width: 38px;
      min-height: 38px;
      padding: 0;
    }

    .chip {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 12px;
      background: #fff;
      color: var(--muted);
    }

    .chip:hover {
      border-color: #cbd5e1;
      background: #f9fafb;
    }

    .chip.active {
      border-color: var(--primary);
      background: #fff0eb;
      color: var(--primary);
      font-weight: 700;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .card[draggable="true"] {
      cursor: grab;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    .card.dragging {
      cursor: grabbing;
      opacity: 0.58;
      transform: scale(0.98);
    }

    .card.drag-over-before,
    .card.drag-over-after {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(255, 87, 34, 0.16);
    }

    .card.drag-over-before {
      border-top-color: var(--primary);
      border-top-width: 3px;
    }

    .card.drag-over-after {
      border-bottom-color: var(--primary);
      border-bottom-width: 3px;
    }

    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .tool-name {
      margin: 0;
      font-size: 17px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .url {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      overflow-wrap: anywhere;
      margin: 0 0 12px;
    }

    .meta {
      display: inline-flex;
      gap: 6px;
      flex-wrap: wrap;
      max-width: 100%;
      margin-bottom: 14px;
    }

    .tag {
      border-radius: 999px;
      padding: 5px 9px;
      background: #f3f4f6;
      color: var(--muted);
      font-size: 12px;
      line-height: 1;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .empty {
      min-height: 320px;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.72);
      display: grid;
      place-items: center;
      text-align: center;
      padding: 32px;
    }

    .empty h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .empty p {
      margin: 0 0 18px;
      color: var(--muted);
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(17, 24, 39, 0.48);
    }

    .modal.show {
      display: flex;
    }

    .dialog {
      width: min(560px, 100%);
      max-height: calc(100vh - 36px);
      overflow: auto;
      border-radius: 8px;
      background: #fff;
      box-shadow: var(--shadow);
      padding: 20px;
    }

    .dialog-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .dialog-head h2 {
      margin: 0;
      font-size: 20px;
    }

    .form {
      display: grid;
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .field label {
      font-weight: 650;
      font-size: 14px;
    }

    .field input,
    .field select {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 11px;
      background: #fff;
    }

    .field select[multiple] {
      height: 120px;
      padding: 8px 11px;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .category-list {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .category-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 8px;
      align-items: center;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 30;
      display: none;
      max-width: min(420px, calc(100vw - 40px));
      border-radius: 8px;
      background: #111827;
      color: #fff;
      padding: 12px 14px;
      box-shadow: var(--shadow);
    }

    .toast.show {
      display: block;
    }

    .mobile-menu {
      display: none;
    }

    @media (max-width: 820px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
        height: auto;
        padding: 14px;
      }

      .nav {
        grid-template-columns: repeat(2, 1fr);
      }

      .nav-btn {
        justify-content: center;
        text-align: center;
      }

      .nav-btn span.count {
        display: none;
      }

      .side-category-panel {
        gap: 10px;
      }

      .side-category-list {
        display: flex;
        overflow-x: auto;
        padding: 0 0 2px;
      }

      .side-category-btn {
        width: auto;
        white-space: nowrap;
      }

      .side-actions {
        grid-template-columns: repeat(2, 1fr);
      }

      .main {
        padding: 18px 14px 28px;
      }

      .topbar {
        display: grid;
      }

      .category-filter,
      .search {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">K</div>
        <span>极简KitBox</span>
      </div>

      <nav class="nav" aria-label="主菜单">
        <button class="nav-btn" data-view="favorites">
          收藏
          <span class="count" id="favorite-count">0</span>
        </button>
      </nav>

      <div class="side-category-panel">
        <div class="side-title">分类</div>
        <div class="side-category-list" id="side-category-list" aria-label="分类菜单"></div>
      </div>

      <div class="side-actions">
        <button class="btn primary" id="add-tool-btn">新增工具站</button>
        <button class="btn" id="manage-category-btn">修改分类</button>
        <button class="btn" id="sync-default-btn">同步默认配置</button>
        <button class="btn" id="upload-default-btn">上传默认配置</button>
        <button class="btn" id="deploy-default-btn">一键部署配置</button>
        <button class="btn" id="export-btn">导出配置</button>
        <button class="btn" id="import-btn">导入配置</button>
        <input id="import-file" type="file" accept="application/json,.json" hidden>
      </div>
    </aside>

    <main class="main">
      <section class="topbar">
        <div class="title">
          <h1 id="view-title">首页</h1>
          <p id="view-description">按分类筛选工具站。</p>
        </div>
      </section>

      <section class="toolbar">
        <div class="category-filter" id="category-filter" aria-label="分类筛选"></div>
        <input class="search" id="search-input" type="search" placeholder="模糊搜索">
      </section>

      <section class="grid" id="tools-grid" aria-live="polite"></section>
      <section class="empty" id="empty-state" hidden></section>
    </main>
  </div>

  <div class="modal" id="tool-modal" role="dialog" aria-modal="true" aria-labelledby="tool-modal-title">
    <div class="dialog">
      <div class="dialog-head">
        <h2 id="tool-modal-title">新增工具站</h2>
        <button class="btn icon" data-close-modal="tool-modal" aria-label="关闭">×</button>
      </div>
      <form class="form" id="tool-form">
        <input type="hidden" id="tool-id">
        <div class="field">
          <label for="tool-name">工具站名称</label>
          <input id="tool-name" type="text" placeholder="例如：Seedance 控制台" required>
        </div>
        <div class="field">
          <label for="tool-url">工具站 URL</label>
          <input id="tool-url" type="url" placeholder="https://example.com" required>
        </div>
        <div class="field">
          <label for="tool-category">所属分类（可多选）</label>
          <select id="tool-category" multiple></select>
        </div>
        <div class="form-actions">
          <button class="btn" type="button" data-close-modal="tool-modal">取消</button>
          <button class="btn primary" type="submit">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal" id="category-modal" role="dialog" aria-modal="true" aria-labelledby="category-modal-title">
    <div class="dialog">
      <div class="dialog-head">
        <h2 id="category-modal-title">修改分类</h2>
        <button class="btn icon" data-close-modal="category-modal" aria-label="关闭">×</button>
      </div>
      <form class="form" id="category-form">
        <input type="hidden" id="category-id">
        <div class="field">
          <label for="category-name">分类名称</label>
          <input id="category-name" type="text" placeholder="例如：AI 工具" required>
        </div>
        <div class="form-actions">
          <button class="btn" type="button" id="reset-category-form">新建分类</button>
          <button class="btn primary" type="submit">保存分类</button>
        </div>
      </form>
      <div class="category-list" id="category-list"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY = "mytools-config-v1";
    const DEFAULT_CONFIG_URL = "mytools.default.json";
    const DEFAULT_CONFIG_VERSION = 3;
    const LOCAL_API_BASE = "http://localhost:4174";

    let state = { version: 1, categories: [], tools: [] };
    let currentView = "categories";
    let activeCategoryId = "all";
    let draggedToolId = "";
    let suppressCardOpenAfterDrag = false;

    const elements = {
      navButtons: document.querySelectorAll(".nav-btn"),
      favoriteCount: document.getElementById("favorite-count"),
      viewTitle: document.getElementById("view-title"),
      viewDescription: document.getElementById("view-description"),
      sideCategoryList: document.getElementById("side-category-list"),
      categoryFilter: document.getElementById("category-filter"),
      searchInput: document.getElementById("search-input"),
      toolsGrid: document.getElementById("tools-grid"),
      emptyState: document.getElementById("empty-state"),
      toolModal: document.getElementById("tool-modal"),
      toolForm: document.getElementById("tool-form"),
      toolModalTitle: document.getElementById("tool-modal-title"),
      toolId: document.getElementById("tool-id"),
      toolName: document.getElementById("tool-name"),
      toolUrl: document.getElementById("tool-url"),
      toolCategory: document.getElementById("tool-category"),
      categoryModal: document.getElementById("category-modal"),
      categoryForm: document.getElementById("category-form"),
      categoryId: document.getElementById("category-id"),
      categoryName: document.getElementById("category-name"),
      categoryList: document.getElementById("category-list"),
      importFile: document.getElementById("import-file"),
      toast: document.getElementById("toast"),
    };

    async function loadState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        try {
          const storedState = normalizeState(JSON.parse(raw));
          if (storedState.categories.length > 0 || storedState.tools.length > 0) {
            return storedState;
          }
          localStorage.removeItem(STORAGE_KEY);
        } catch {
          localStorage.removeItem(STORAGE_KEY);
        }
      }

      return loadDefaultState();
    }

    async function loadDefaultState() {
      try {
        const response = await fetch(DEFAULT_CONFIG_URL, { cache: "no-store" });
        if (!response.ok) {
          throw new Error("default config not found");
        }
        const defaultState = normalizeState(await response.json());
        defaultState.source = "default";
        defaultState.defaultVersion = DEFAULT_CONFIG_VERSION;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultState));
        return defaultState;
      } catch {
        return { version: 1, categories: [], tools: [] };
      }
    }

    function normalizeState(data) {
      data = data && typeof data === "object" ? data : {};
      const categories = Array.isArray(data.categories) ? data.categories : [];
      const tools = Array.isArray(data.tools) ? data.tools : [];
      return {
        version: 1,
        source: data.source || "user",
        defaultVersion: data.defaultVersion || null,
        updatedAt: data.updatedAt || null,
        categories: categories
          .filter((item) => item && item.name)
          .map((item) => ({
            id: String(item.id || createId("cat")),
            name: String(item.name).trim(),
          })),
        tools: tools
          .filter((item) => item && item.name && item.url)
          .map((item) => ({
            id: String(item.id || createId("tool")),
            name: String(item.name).trim(),
            url: normalizeUrl(String(item.url)),
            categoryIds: normalizeCategoryIds(item),
            isFavorite: Boolean(item.isFavorite),
          })),
      };
    }

    function normalizeCategoryIds(item) {
      if (Array.isArray(item.categoryIds)) {
        return item.categoryIds.map((id) => String(id)).filter(Boolean);
      }
      return item.categoryId ? [String(item.categoryId)] : [];
    }

    function saveState() {
      state.source = "user";
      state.defaultVersion = null;
      state.updatedAt = new Date().toISOString();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function createId(prefix) {
      return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    }

    function normalizeUrl(url) {
      return String(url).trim();
    }

    function getCategoryNames(categoryIds) {
      const ids = Array.isArray(categoryIds) ? categoryIds : [];
      const names = ids
        .map((id) => state.categories.find((category) => category.id === id)?.name)
        .filter(Boolean);
      return names.length > 0 ? names : ["未分类"];
    }

    function setView(view) {
      currentView = view;
      render();
    }

    function render() {
      renderCounts();
      renderSideCategoryOptions();
      renderCategoryFilterOptions();
      renderToolCategoryOptions();
      renderCategoryManager();
      renderTools();
    }

    function renderCounts() {
      elements.favoriteCount.textContent = state.tools.filter((tool) => tool.isFavorite).length;
    }

    function getCategoryOptions() {
      return [
        { id: "all", name: "全部" },
        ...state.categories,
        { id: "uncategorized", name: "未分类" },
      ];
    }

    function getCategoryToolCount(categoryId) {
      if (categoryId === "all") return state.tools.length;
      if (categoryId === "uncategorized") {
        return state.tools.filter((tool) => tool.categoryIds.length === 0).length;
      }
      return state.tools.filter((tool) => tool.categoryIds.includes(categoryId)).length;
    }

    function ensureActiveCategory(options) {
      if (!options.some((category) => category.id === activeCategoryId)) {
        activeCategoryId = "all";
      }
    }

    function renderSideCategoryOptions() {
      const options = getCategoryOptions();
      ensureActiveCategory(options);
      elements.sideCategoryList.innerHTML = options
        .map((category) => `
          <button class="side-category-btn ${currentView === "categories" && activeCategoryId === category.id ? "active" : ""}" data-side-category="${escapeHtml(category.id)}">
            <span>${escapeHtml(category.name)}</span>
            <span class="side-category-count">${getCategoryToolCount(category.id)}</span>
          </button>
        `)
        .join("");
      elements.sideCategoryList.querySelectorAll("[data-side-category]").forEach((button) => {
        button.addEventListener("click", () => {
          currentView = "categories";
          activeCategoryId = button.dataset.sideCategory;
          render();
        });
      });
    }

    function renderCategoryFilterOptions() {
      const options = getCategoryOptions();
      ensureActiveCategory(options);
      elements.categoryFilter.innerHTML = options
        .map((category) => `
          <button class="chip ${activeCategoryId === category.id ? "active" : ""}" data-category-filter="${escapeHtml(category.id)}">
            ${escapeHtml(category.name)}
          </button>
        `)
        .join("");
      elements.categoryFilter.querySelectorAll("[data-category-filter]").forEach((button) => {
        button.addEventListener("click", () => {
          activeCategoryId = button.dataset.categoryFilter;
          render();
        });
      });
    }

    function renderToolCategoryOptions() {
      if (state.categories.length === 0) {
        elements.toolCategory.innerHTML = "";
        return;
      }
      elements.toolCategory.innerHTML = state.categories
        .map((category) => `<option value="${escapeHtml(category.id)}">${escapeHtml(category.name)}</option>`)
        .join("");
    }

    function getVisibleTools() {
      const query = elements.searchInput.value.trim().toLowerCase();
      let tools = [...state.tools];
      if (currentView === "favorites") {
        tools = tools.filter((tool) => tool.isFavorite);
      }
      if (activeCategoryId === "uncategorized") {
        tools = tools.filter((tool) => tool.categoryIds.length === 0);
      } else if (activeCategoryId !== "all") {
        tools = tools.filter((tool) => tool.categoryIds.includes(activeCategoryId));
      }
      if (query) {
        tools = tools.filter((tool) => {
          const categoryName = getCategoryNames(tool.categoryIds).join(" ").toLowerCase();
          return tool.name.toLowerCase().includes(query)
            || tool.url.toLowerCase().includes(query)
            || categoryName.includes(query);
        });
      }
      return tools;
    }

    function renderTools() {
      elements.navButtons.forEach((button) => {
        button.classList.toggle("active", button.dataset.view === currentView);
      });
      const titleByView = {
        categories: ["首页", "按分类筛选工具站。"],
        favorites: ["收藏", "集中展示你收藏的常用工具站。"],
      };
      elements.viewTitle.textContent = titleByView[currentView][0];
      elements.viewDescription.textContent = titleByView[currentView][1];

      const tools = getVisibleTools();
      elements.toolsGrid.hidden = tools.length === 0;
      elements.emptyState.hidden = true;
      elements.toolsGrid.innerHTML = tools.map(renderToolCard).join("");

      elements.toolsGrid.querySelectorAll("[data-open-tool]").forEach((button) => {
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          openTool(button.dataset.openTool);
        });
      });
      elements.toolsGrid.querySelectorAll("[data-favorite-tool]").forEach((button) => {
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          toggleFavorite(button.dataset.favoriteTool);
        });
      });
      elements.toolsGrid.querySelectorAll("[data-edit-tool]").forEach((button) => {
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          openToolModal(button.dataset.editTool);
        });
      });
      elements.toolsGrid.querySelectorAll("[data-delete-tool]").forEach((button) => {
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          deleteTool(button.dataset.deleteTool);
        });
      });
      bindToolDragSorting(tools);
      elements.toolsGrid.querySelectorAll(".card").forEach((card) => {
        card.addEventListener("click", () => {
          if (suppressCardOpenAfterDrag) {
            suppressCardOpenAfterDrag = false;
            return;
          }
          openTool(card.dataset.toolId);
        });
      });
    }

    function renderToolCard(tool) {
      const star = tool.isFavorite ? "★" : "☆";
      return `
        <article class="card" data-tool-id="${escapeHtml(tool.id)}" tabindex="0" draggable="true" title="拖拽调整排序">
          <div class="card-head">
            <h2 class="tool-name">${escapeHtml(tool.name)}</h2>
            <button class="btn icon" data-favorite-tool="${escapeHtml(tool.id)}" title="${tool.isFavorite ? "取消收藏" : "收藏"}">${star}</button>
          </div>
          <div class="meta">${getCategoryNames(tool.categoryIds).map((name) => `<span class="tag">${escapeHtml(name)}</span>`).join("")}</div>
          <div class="card-actions">
            <button class="btn" data-open-tool="${escapeHtml(tool.id)}">打开</button>
            <button class="btn" data-edit-tool="${escapeHtml(tool.id)}">编辑</button>
            <button class="btn" data-delete-tool="${escapeHtml(tool.id)}">删除</button>
          </div>
        </article>
      `;
    }

    function bindToolDragSorting(visibleTools) {
      const visibleIds = visibleTools.map((tool) => tool.id);
      const cards = [...elements.toolsGrid.querySelectorAll(".card")];
      elements.toolsGrid.ondragover = null;
      elements.toolsGrid.ondrop = null;
      if (visibleIds.length < 2) return;

      elements.toolsGrid.ondragover = (event) => {
        if (!draggedToolId) return;
        event.preventDefault();
      };
      elements.toolsGrid.ondrop = (event) => {
        if (!draggedToolId || event.target.closest(".card")) return;
        event.preventDefault();
        reorderTools(draggedToolId, "", "end", visibleIds);
      };

      cards.forEach((card) => {
        card.addEventListener("dragstart", (event) => {
          if (event.target.closest("button")) {
            event.preventDefault();
            return;
          }
          draggedToolId = card.dataset.toolId;
          suppressCardOpenAfterDrag = true;
          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.setData("text/plain", draggedToolId);
          card.classList.add("dragging");
        });

        card.addEventListener("dragover", (event) => {
          if (!draggedToolId || draggedToolId === card.dataset.toolId) return;
          event.preventDefault();
          event.dataTransfer.dropEffect = "move";
          markDragTarget(card, getDragPosition(event, card));
        });

        card.addEventListener("drop", (event) => {
          if (!draggedToolId || draggedToolId === card.dataset.toolId) return;
          event.preventDefault();
          const position = getDragPosition(event, card);
          reorderTools(draggedToolId, card.dataset.toolId, position, visibleIds);
        });

        card.addEventListener("dragend", () => {
          clearDragStyles();
          draggedToolId = "";
        });
      });
    }

    function getDragPosition(event, card) {
      const rect = card.getBoundingClientRect();
      const isWideGrid = elements.toolsGrid.clientWidth > card.offsetWidth * 1.5;
      if (isWideGrid) {
        return event.clientX < rect.left + rect.width / 2 ? "before" : "after";
      }
      return event.clientY < rect.top + rect.height / 2 ? "before" : "after";
    }

    function markDragTarget(card, position) {
      clearDragStyles();
      card.classList.add(position === "before" ? "drag-over-before" : "drag-over-after");
    }

    function clearDragStyles() {
      elements.toolsGrid.querySelectorAll(".dragging, .drag-over-before, .drag-over-after").forEach((card) => {
        card.classList.remove("dragging", "drag-over-before", "drag-over-after");
      });
    }

    function reorderTools(sourceId, targetId, position, visibleIds) {
      const sourceTool = state.tools.find((tool) => tool.id === sourceId);
      if (!sourceTool) return;

      const nextTools = state.tools.filter((tool) => tool.id !== sourceId);
      if (position === "end" || !targetId) {
        const visibleWithoutSource = visibleIds.filter((id) => id !== sourceId);
        const lastVisibleId = visibleWithoutSource[visibleWithoutSource.length - 1];
        const lastVisibleIndex = nextTools.findIndex((tool) => tool.id === lastVisibleId);
        nextTools.splice(lastVisibleIndex === -1 ? nextTools.length : lastVisibleIndex + 1, 0, sourceTool);
      } else {
        const targetIndex = nextTools.findIndex((tool) => tool.id === targetId);
        if (targetIndex === -1) return;
        nextTools.splice(position === "before" ? targetIndex : targetIndex + 1, 0, sourceTool);
      }

      state.tools = nextTools;
      clearDragStyles();
      draggedToolId = "";
      saveState();
      render();
      showToast("排序已更新");
    }

    function renderCategoryManager() {
      if (state.categories.length === 0) {
        elements.categoryList.innerHTML = "";
        return;
      }

      elements.categoryList.innerHTML = state.categories.map((category) => {
        const count = state.tools.filter((tool) => tool.categoryIds.includes(category.id)).length;
        return `
          <div class="category-row">
            <div>
              <strong>${escapeHtml(category.name)}</strong>
              <div class="url">${count} 个工具站</div>
            </div>
            <button class="btn" data-edit-category="${escapeHtml(category.id)}">编辑</button>
            <button class="btn danger" data-delete-category="${escapeHtml(category.id)}">删除</button>
          </div>
        `;
      }).join("");

      elements.categoryList.querySelectorAll("[data-edit-category]").forEach((button) => {
        button.addEventListener("click", () => editCategory(button.dataset.editCategory));
      });
      elements.categoryList.querySelectorAll("[data-delete-category]").forEach((button) => {
        button.addEventListener("click", () => deleteCategory(button.dataset.deleteCategory));
      });
    }

    function openTool(toolId) {
      const tool = state.tools.find((item) => item.id === toolId);
      if (!tool) return;
      window.open(tool.url, "_blank", "noopener,noreferrer");
    }

    function openToolModal(toolId) {
      const tool = state.tools.find((item) => item.id === toolId);
      elements.toolModalTitle.textContent = tool ? "编辑工具站" : "新增工具站";
      elements.toolId.value = tool?.id || "";
      elements.toolName.value = tool?.name || "";
      elements.toolUrl.value = tool?.url || "";
      const selectedIds = tool?.categoryIds || [];
      Array.from(elements.toolCategory.options).forEach((option) => {
        option.selected = selectedIds.includes(option.value);
      });
      showModal(elements.toolModal);
      elements.toolName.focus();
    }

    function saveTool(event) {
      event.preventDefault();
      const id = elements.toolId.value;
      const name = elements.toolName.value.trim();
      const url = normalizeUrl(elements.toolUrl.value);
      const categoryIds = Array.from(elements.toolCategory.selectedOptions).map((option) => option.value);

      if (!name) {
        showToast("请填写工具站名称");
        return;
      }
      if (!url) {
        showToast("请填写工具站 URL");
        return;
      }

      const duplicate = state.tools.find((tool) => tool.url === url && tool.id !== id);
      if (duplicate && !confirm("这个 URL 已存在，仍然保存吗？")) {
        return;
      }

      if (id) {
        state.tools = state.tools.map((tool) => tool.id === id ? { ...tool, name, url, categoryIds } : tool);
      } else {
        state.tools.push({
          id: createId("tool"),
          name,
          url,
          categoryIds,
          isFavorite: false,
        });
      }

      saveState();
      hideModal(elements.toolModal);
      render();
      showToast(id ? "工具站已更新" : "工具站已新增");
    }

    function deleteTool(toolId) {
      const tool = state.tools.find((item) => item.id === toolId);
      if (!tool) return;
      if (!confirm(`确定删除“${tool.name}”吗？`)) return;
      state.tools = state.tools.filter((item) => item.id !== toolId);
      saveState();
      render();
      showToast("工具站已删除");
    }

    function toggleFavorite(toolId) {
      state.tools = state.tools.map((tool) => (
        tool.id === toolId ? { ...tool, isFavorite: !tool.isFavorite } : tool
      ));
      saveState();
      render();
    }

    function resetCategoryForm() {
      elements.categoryId.value = "";
      elements.categoryName.value = "";
      elements.categoryName.focus();
    }

    function editCategory(categoryId) {
      const category = state.categories.find((item) => item.id === categoryId);
      if (!category) return;
      elements.categoryId.value = category.id;
      elements.categoryName.value = category.name;
      elements.categoryName.focus();
    }

    function saveCategory(event) {
      event.preventDefault();
      const id = elements.categoryId.value;
      const name = elements.categoryName.value.trim();
      if (!name) {
        showToast("请填写分类名称");
        return;
      }

      const duplicate = state.categories.find((category) => category.name === name && category.id !== id);
      if (duplicate) {
        showToast("分类名称已存在");
        return;
      }

      if (id) {
        state.categories = state.categories.map((category) => category.id === id ? { ...category, name } : category);
      } else {
        state.categories.push({ id: createId("cat"), name });
      }

      resetCategoryForm();
      saveState();
      render();
      showToast(id ? "分类已更新" : "分类已新增");
    }

    function deleteCategory(categoryId) {
      const category = state.categories.find((item) => item.id === categoryId);
      if (!category) return;

      const usedCount = state.tools.filter((tool) => tool.categoryIds.includes(categoryId)).length;
      const message = usedCount > 0
        ? `“${category.name}”下有 ${usedCount} 个工具站。删除分类后，会从这些工具站的分类列表中移除。确定删除吗？`
        : `确定删除分类“${category.name}”吗？`;
      if (!confirm(message)) return;

      state.categories = state.categories.filter((item) => item.id !== categoryId);
      state.tools = state.tools.map((tool) => ({
        ...tool,
        categoryIds: tool.categoryIds.filter((id) => id !== categoryId),
      }));
      if (activeCategoryId === categoryId) {
        activeCategoryId = "all";
      }
      resetCategoryForm();
      saveState();
      render();
      showToast("分类已删除");
    }

    function exportConfig() {
      downloadConfig(`mytools.default-${getTodayString()}.json`);
      showToast("配置已导出");
    }

    async function syncDefaultConfig() {
      if (!confirm("确定用默认配置覆盖当前浏览器缓存配置吗？")) return;
      state = await loadDefaultState();
      currentView = "categories";
      activeCategoryId = "all";
      elements.searchInput.value = "";
      render();
      showToast("已同步默认配置");
    }

    async function uploadDefaultConfig() {
      const password = prompt("请输入上传口令");
      if (password === null) return;
      if (!password.trim()) {
        showToast("请输入上传口令");
        return;
      }

      try {
        const response = await fetch(getLocalApiUrl("api/default-config"), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            password,
            config: {
              version: 1,
              categories: state.categories,
              tools: state.tools,
            },
          }),
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(result.message || "upload failed");
        }
        showToast("默认配置已上传");
      } catch (error) {
        showToast(error.message || "上传失败，请确认使用支持上传的本地服务");
      }
    }

    async function deployDefaultConfig() {
      const password = prompt("请输入部署口令");
      if (password === null) return;
      if (!password.trim()) {
        showToast("请输入部署口令");
        return;
      }
      if (!confirm("确定把当前浏览器缓存配置写入默认配置，并提交推送到 GitHub 吗？")) return;

      try {
        showToast("正在部署配置...");
        const response = await fetch(getLocalApiUrl("api/deploy-config"), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            password,
            config: {
              version: 1,
              categories: state.categories,
              tools: state.tools,
            },
          }),
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(result.message || "deploy failed");
        }
        showToast(result.message || "配置已部署");
      } catch (error) {
        showToast(error.message || "部署失败，请确认本地服务已启动");
      }
    }

    function getLocalApiUrl(path) {
      return window.location.origin === LOCAL_API_BASE
        ? path
        : `${LOCAL_API_BASE}/${path}`;
    }

    function getTodayString() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function downloadConfig(filename) {
      const payload = JSON.stringify({
        version: 1,
        categories: state.categories,
        tools: state.tools,
      }, null, 2);
      const blob = new Blob([payload], { type: "application/json;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function importConfig(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const imported = normalizeState(JSON.parse(String(reader.result)));
          if (!Array.isArray(imported.categories) || !Array.isArray(imported.tools)) {
            throw new Error("invalid");
          }
          state = mergeState(state, imported);
          saveState();
          render();
          showToast("配置已导入");
        } catch {
          showToast("导入失败，请选择有效的 JSON 配置文件");
        } finally {
          elements.importFile.value = "";
        }
      };
      reader.readAsText(file, "utf-8");
    }

    function mergeState(current, imported) {
      const categories = [...current.categories];
      const tools = [...current.tools];
      const categoryIdMap = new Map();

      imported.categories.forEach((category) => {
        const existing = categories.find((item) => item.name === category.name);
        if (existing) {
          categoryIdMap.set(category.id, existing.id);
        } else {
          const next = { ...category, id: createId("cat") };
          categories.push(next);
          categoryIdMap.set(category.id, next.id);
        }
      });

      imported.tools.forEach((tool) => {
        const mappedCategoryIds = tool.categoryIds.map((id) => categoryIdMap.get(id)).filter(Boolean);
        const existing = tools.find((item) => item.url === tool.url);
        if (existing) {
          existing.name = tool.name;
          existing.categoryIds = Array.from(new Set([...existing.categoryIds, ...mappedCategoryIds]));
          existing.isFavorite = existing.isFavorite || tool.isFavorite;
        } else {
          tools.push({
            ...tool,
            id: createId("tool"),
            categoryIds: mappedCategoryIds,
          });
        }
      });

      return { version: 1, categories, tools };
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function showModal(modal) {
      modal.classList.add("show");
    }

    function hideModal(modal) {
      modal.classList.remove("show");
    }

    function showToast(message) {
      elements.toast.textContent = message;
      elements.toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => {
        elements.toast.classList.remove("show");
      }, 2200);
    }

    function bindEvents() {
      elements.navButtons.forEach((button) => {
        button.addEventListener("click", () => setView(button.dataset.view));
      });
      elements.searchInput.addEventListener("input", renderTools);
      document.getElementById("add-tool-btn").addEventListener("click", () => openToolModal());
      document.getElementById("manage-category-btn").addEventListener("click", () => {
        resetCategoryForm();
        showModal(elements.categoryModal);
      });
      document.getElementById("export-btn").addEventListener("click", exportConfig);
      document.getElementById("sync-default-btn").addEventListener("click", syncDefaultConfig);
      document.getElementById("upload-default-btn").addEventListener("click", uploadDefaultConfig);
      document.getElementById("deploy-default-btn").addEventListener("click", deployDefaultConfig);
      document.getElementById("import-btn").addEventListener("click", () => elements.importFile.click());
      elements.importFile.addEventListener("change", () => importConfig(elements.importFile.files[0]));
      elements.toolForm.addEventListener("submit", saveTool);
      elements.categoryForm.addEventListener("submit", saveCategory);
      document.getElementById("reset-category-form").addEventListener("click", resetCategoryForm);
      document.querySelectorAll("[data-close-modal]").forEach((button) => {
        button.addEventListener("click", () => hideModal(document.getElementById(button.dataset.closeModal)));
      });
      document.querySelectorAll(".modal").forEach((modal) => {
        modal.addEventListener("click", (event) => {
          if (event.target === modal) hideModal(modal);
        });
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          hideModal(elements.toolModal);
          hideModal(elements.categoryModal);
        }
      });
    }

    async function initApp() {
      state = await loadState();
      bindEvents();
      render();
    }

    initApp();
  </script>
</body>
</html>
